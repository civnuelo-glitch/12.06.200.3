<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JS Quest – apprends JavaScript en jouant</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff0f6;--card:#fff;--ink:#3a1030;--mute:#8a5a78;--blue:#d6307c;--sun:#3cc9b5;--ok:#17a665;--bad:#d9381e;--line:#f6cfe0;--code:#2a0f24;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a0f24;--card:#3a1832;--ink:#fff0f7;--mute:#d6a5c3;--line:#5c2c52;--code:#1a0916}}
:root[data-theme="dark"]{--bg:#2a0f24;--card:#3a1832;--ink:#fff0f7;--mute:#d6a5c3;--line:#5c2c52;--code:#1a0916}
*{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Fredoka",system-ui,sans-serif;font-size:18px;line-height:1.5}
main{max-width:720px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
h1{font-size:2rem;margin:0;font-weight:700}
.xp{background:var(--sun);color:#14183a;font-weight:700;padding:6px 14px;border-radius:999px;white-space:nowrap}
.sub{color:var(--mute);margin:0 0 20px}
.world{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:16px 18px;margin-bottom:14px}
.world h2{margin:0 0 10px;font-size:1.25rem;display:flex;align-items:center;gap:10px}
.world h2 span{font-size:1.7rem}
.dots{display:flex;gap:10px}
.dot{width:54px;height:54px;border-radius:50%;border:3px solid var(--line);background:var(--bg);color:var(--ink);font:700 1.1rem "Fredoka",sans-serif;cursor:pointer}
.dot:disabled{opacity:.4;cursor:not-allowed}
.dot.done{background:var(--ok);border-color:var(--ok);color:#fff}
.dot.cur{background:var(--blue);border-color:var(--blue);color:#fff;transform:scale(1.1)}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.btn{font:700 1rem "Fredoka",sans-serif;border:0;border-radius:14px;padding:12px 20px;cursor:pointer;background:var(--blue);color:#fff}
.btn.alt{background:var(--card);color:var(--ink);border:3px solid var(--line)}
.btn:disabled{opacity:.5}
.lesson{background:var(--card);border-left:8px solid var(--sun);border-radius:14px;padding:12px 16px;margin:12px 0}
code{background:var(--code);color:#ffc2de;padding:1px 7px;border-radius:6px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.88em}
textarea{width:100%;min-height:170px;background:var(--code);color:#e8ecff;border:3px solid var(--line);border-radius:14px;padding:12px;font:15px/1.5 ui-monospace,Menlo,Consolas,monospace;resize:vertical}
.opts{display:grid;gap:10px;margin:12px 0}
.opt{text-align:left}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.fb{margin-top:12px;padding:12px 16px;border-radius:14px;font-weight:600;overflow-wrap:anywhere}
.fb.ok{background:var(--ok);color:#fff;animation:pop .35s}
.fb.no{background:var(--bad);color:#fff}
.hint{color:var(--mute);margin-top:10px}
.plan{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:14px 18px;margin-bottom:14px}
.plan h2{margin:0 0 6px}
.pl{display:block;width:100%;text-align:left;margin-bottom:8px}
.pl.today{border-color:var(--blue)}
input{width:100%;font:inherit;padding:10px 12px;border-radius:12px;border:3px solid var(--line);background:var(--bg);color:var(--ink);margin:4px 0 12px}
label{font-weight:600}
.corr{background:var(--card);border:3px solid var(--blue);border-radius:16px;padding:4px 16px 12px;margin-top:14px}
.corr h3{margin:10px 0 0}
.corr pre{background:var(--code);color:#e8ecff;padding:12px;border-radius:12px;overflow-x:auto;font:14px/1.5 ui-monospace,Menlo,Consolas,monospace;margin:0}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.fb.ok{animation:none}}
</style>
</head>

{t:"Variables",e:"📦",l:"Une variable est une boîte avec un nom. <code>const</code> pour une valeur fixe, <code>let</code> pour une valeur qui change.<br><code>const ville = \"Abidjan\";</code>",c:[
 {q:"Quel mot-clé sert à créer une valeur qui ne change <b>jamais</b> ?",o:["const","let","if"],a:0,x:"<code>const</code> crée une constante : une fois la valeur donnée, on ne peut plus la changer (sinon JavaScript affiche une erreur). <code>let</code> crée une variable modifiable. <code>if</code> n'est pas un mot-clé de variable : il sert aux conditions."},
 {p:"Crée une constante <code>prenom</code> qui contient ton prénom (entre guillemets).",s:"// écris ton code ici\n",t:[["typeof prenom===\"string\"&&prenom.length>0",true]],h:"const prenom = \"...\";",x:"Un texte s'écrit entre guillemets. On déclare avec <code>const</code>, on donne un nom, puis <code>=</code> et la valeur. Le test vérifie que <code>prenom</code> est bien du texte non vide. Erreurs fréquentes : oublier les guillemets (JavaScript croirait que c'est un nom de variable) ou écrire le nom avec une faute, car les majuscules comptent.",r:"const prenom = \"Awa\";"},
 {p:"Crée une constante <code>total</code> égale à <code>prix * quantite</code>.",s:"const prix = 1500;\nconst quantite = 4;\n",t:[["total",6000]],h:"const total = prix * quantite;",x:"Une variable peut être calculée à partir d'autres : <code>prix * quantite</code> donne 1500 × 4 = 6000, et on range le résultat dans <code>total</code>. Le nom doit s'écrire exactement <code>total</code>.",r:"const total = prix * quantite;"}]},
{t:"Conditions",e:"🚦",l:"<code>if</code> choisit quoi faire selon une condition. Compare avec <code>===</code>, <code>&gt;</code>, <code>&gt;=</code>.<br><code>if (age &gt;= 18) { ... } else { ... }</code>",c:[
 {q:"Que renvoie <code>5 === \"5\"</code> ?",o:["true","false","une erreur"],a:1,x:"<code>===</code> compare la valeur <b>et</b> le type. Ici 5 est un nombre et « 5 » entre guillemets est du texte : ce n'est pas strictement égal, donc le résultat est <code>false</code>. Avec <code>==</code> (à éviter), JavaScript convertirait le texte en nombre et donnerait <code>true</code>."},
 {p:"Écris la fonction <code>estMajeur(age)</code> qui renvoie <code>true</code> si l'âge est 18 ou plus, sinon <code>false</code>.",s:"function estMajeur(age) {\n  // à toi\n}\n",t:[["estMajeur(18)",true],["estMajeur(17)",false],["estMajeur(40)",true]],h:"return age >= 18;",x:"La condition <code>age &gt;= 18</code> est déjà un booléen : elle vaut <code>true</code> ou <code>false</code>. On peut donc la renvoyer directement avec <code>return</code>. Piège : avec <code>&gt;</code> seul, 18 donnerait <code>false</code> alors qu'à 18 ans on est majeur. Il faut <code>&gt;=</code>.",r:"function estMajeur(age) {\n  return age >= 18;\n}"},
 {p:"Écris <code>signe(n)</code> : renvoie <code>\"positif\"</code>, <code>\"négatif\"</code> ou <code>\"zéro\"</code>.",s:"function signe(n) {\n  \n}\n",t:[["signe(5)","positif"],["signe(-2)","négatif"],["signe(0)","zéro"]],h:"Utilise if, else if, else avec return.",x:"On teste les cas dans l'ordre : si <code>n &gt; 0</code>, on renvoie « positif » ; sinon si <code>n &lt; 0</code>, « négatif » ; sinon c'est forcément zéro. <code>return</code> arrête la fonction dès qu'il s'exécute, donc pas besoin de <code>else</code> ensuite. Vérifie l'orthographe exacte des mots, accents compris.",r:"function signe(n) {\n  if (n > 0) return \"positif\";\n  if (n < 0) return \"négatif\";\n  return \"zéro\";\n}"}]},
{t:"Boucles",e:"🔁",l:"Une boucle répète du code.<br><code>for (let i = 1; i &lt;= 3; i++) { console.log(i); }</code><br>Départ, condition, pas : <code>i</code> va de 1 à 3.",c:[
 {q:"Combien de fois s'exécute <code>for (let i = 0; i &lt; 3; i++)</code> ?",o:["2 fois","3 fois","4 fois"],a:1,x:"On part de <code>i = 0</code> et on continue tant que <code>i &lt; 3</code>. Donc i vaut 0, 1, 2 : à 3 la condition devient fausse et la boucle s'arrête. Cela fait 3 tours. Avec <code>&lt;=</code>, il y en aurait eu 4."},
 {p:"Écris <code>somme(n)</code> qui renvoie 1 + 2 + ... + n.",s:"function somme(n) {\n  let total = 0;\n  // ta boucle ici\n  return total;\n}\n",t:[["somme(4)",10],["somme(10)",55]],h:"for (let i = 1; i <= n; i++) { total += i; }",x:"<code>total</code> démarre à 0. À chaque tour, on ajoute <code>i</code> avec <code>total += i</code>. Pour n = 4 : 0+1 = 1, +2 = 3, +3 = 6, +4 = 10. La boucle va de 1 à <b>n inclus</b> (<code>i &lt;= n</code>). Le <code>return total</code> final renvoie le résultat.",r:"function somme(n) {\n  let total = 0;\n  for (let i = 1; i <= n; i++) {\n    total += i;\n  }\n  return total;\n}"},
 {p:"Écris <code>multiplesDe3(max)</code> : un tableau des multiples de 3 jusqu'à <code>max</code>. Ex : max=10 donne <code>[3,6,9]</code>.",s:"function multiplesDe3(max) {\n  const res = [];\n  \n  return res;\n}\n",t:[["JSON.stringify(multiplesDe3(10))","[3,6,9]"],["JSON.stringify(multiplesDe3(2))","[]"]],h:"if (i % 3 === 0) { res.push(i); }",x:"On parcourt les nombres de 1 à <code>max</code>. <code>i % 3 === 0</code> veut dire : le reste de la division par 3 est 0, donc i est un multiple de 3. Dans ce cas, <code>res.push(i)</code> ajoute i au tableau. Pour max = 2, aucun nombre ne passe : on renvoie <code>[]</code>.",r:"function multiplesDe3(max) {\n  const res = [];\n  for (let i = 1; i <= max; i++) {\n    if (i % 3 === 0) {\n      res.push(i);\n    }\n  }\n  return res;\n}"}]},
{t:"Tableaux",e:"🧰",l:"<code>map</code> transforme chaque élément, <code>filter</code> garde ceux qui passent un test.<br><code>[1,2,3].map(x =&gt; x + 1)</code> donne <code>[2,3,4]</code>",c:[

 app.querySelectorAll(".dot").forEach(function(b){b.onclick=function(){play(+b.dataset.id)}});
 app.querySelectorAll(".pl").forEach(function(b){b.onclick=function(){play(dayGo(P[+b.dataset.d]))}});
 var rv=document.getElementById("rv");if(rv)rv.onclick=function(){rev=true;play(S.miss[0])};
 document.getElementById("lo").onclick=function(){if(sb&&UID){sb.auth.signOut().then(function(){UID=null;login()})}else login()};
 var rs2=document.getElementById("rs2");if(rs2)rs2.onclick=function(){play(+rs2.dataset.id)};
 document.getElementById("ex").onclick=function(){prompt("Copie ce code et garde-le : il permet de restaurer ta progression sur un autre appareil.",btoa(unescape(encodeURIComponent(JSON.stringify(S)))))};
 document.getElementById("im").onclick=function(){var c=prompt("Colle ton code de sauvegarde :");if(!c)return;try{var o=JSON.parse(decodeURIComponent(escape(atob(c.trim()))));if(!Array.isArray(o.done))throw 0;S=o;S.miss=S.miss||[];S.start=S.start||Date.now();save();home()}catch(e){alert("Code invalide.")}};
 document.getElementById("rs").onclick=function(){if(confirm("Effacer toute ta progression ?")){S={done:[],xp:0,miss:[],start:Date.now()};save();home()}};
 window.scrollTo(0,0);
}
function play(id){S.last=id;save();
 var c=L[id],w=W[c.w],h='<header><button class="btn alt" id="bk">← Carte</button><div class="xp">'+S.xp+' XP</div></header>';
 h+='<h2>'+w.e+' '+w.t+' · défi '+(id+1)+'/'+L.length+'</h2><div class="lesson">'+w.l+'</div>';
 if(c.q){h+='<p><b>'+c.q+'</b></p><div class="opts">';c.o.forEach(function(o,i){h+='<button class="btn alt opt" data-i="'+i+'">'+o+'</button>'});h+='</div>'}
 else{h+='<p><b>'+c.p+'</b></p><textarea id="ed" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Ton code">'+c.s.replace(/</g,"&lt;")+'</textarea><div class="row"><button class="btn" id="go">▶ Tester mon code</button><button class="btn alt" id="hn">💡 Indice</button></div><div id="hint" class="hint"></div>'}
 h+='<div id="fb" role="status"></div><div class="row" id="nx"></div><div id="corr"></div>';
 app.innerHTML=h;window.scrollTo(0,0);
 document.getElementById("bk").onclick=home;
 var fb=document.getElementById("fb");
 function win(){
  if(S.done.indexOf(id)<0){S.done.push(id);S.xp+=c.q?10:25}
  if(rev){var mi=S.miss.indexOf(id);if(mi>-1)S.miss.splice(mi,1)}
  save();
  fb.className="fb ok";fb.textContent="✅ Bravo ! +"+(c.q?10:25)+" XP";
  var nx=document.getElementById("nx");
  nx.innerHTML=(id+1<L.length?'<button class="btn" id="nb">Défi suivant →</button>':'<button class="btn" id="nb">Terminer 🏆</button>')+'<button class="btn alt" id="cb">📖 Explication</button>';
  document.getElementById("nb").onclick=function(){if(rev){S.miss.length?play(S.miss[0]):home()}else if(id+1<L.length)play(id+1);else home()};bindCorr();
 }
 function bindCorr(){document.getElementById("cb").onclick=function(){var k=document.getElementById("corr");if(k.innerHTML){k.innerHTML="";return}k.innerHTML='<div class="corr"><h3>📖 Correction détaillée</h3><p>'+c.x+'</p>'+(c.r?'<p><b>Une solution possible :</b></p><pre>'+c.r.replace(/</g,"&lt;")+'</pre>':'<p><b>Bonne réponse :</b> '+c.o[c.a]+'</p>')+'</div>'}}
 var tries=0;
 function wrong(m){tries++;if(S.miss.indexOf(id)<0){S.miss.push(id);save()}fb.className="fb no";fb.textContent=m+(tries<2?" Réessaie : la correction se débloque après 2 essais ratés.":"");if(tries>=2){document.getElementById("nx").innerHTML='<button class="btn alt" id="cb">📖 Voir la correction</button>';bindCorr()}}
 if(c.q){app.querySelectorAll(".opt").forEach(function(b){b.onclick=function(){
  if(+b.dataset.i===c.a)win();else wrong("Pas tout à fait, essaie encore !")}})}
 else{
  var ed=document.getElementById("ed");
  ed.onkeydown=function(e){if(e.key==="Tab"){e.preventDefault();var s=ed.selectionStart;ed.value=ed.value.slice(0,s)+"  "+ed.value.slice(ed.selectionEnd);ed.selectionStart=ed.selectionEnd=s+2}};
  document.getElementById("hn").onclick=function(){document.getElementById("hint").textContent="Indice : "+c.h};
  document.getElementById("go").onclick=async function(){
   var code=ed.value;
   for(var i=0;i<c.t.length;i++){
    var t=c.t[i],v;
    try{v=await new Function('"use strict";'+code+"\n;return ("+t[0]+");")()}
    catch(e){wrong("Erreur dans ton code : "+e.message);return}
    if(v!==t[1]){wrong("Test raté : "+t[0]+" devrait donner "+JSON.stringify(t[1])+", mais ton code donne "+JSON.stringify(v)+".");return}
   }
   win();
  };
 }
}
boot();
</script>
</body>
</html>
